services:
  - type: web
    name: table-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: table
      - key: SEED_DEMO_DATA
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # set to the frontend URL, e.g. https://table-frontend.onrender.com

  - type: web
    name: table-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false # set to the backend URL, e.g. https://table-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
